[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nnworkbench"
version = "0.1.0"
description = "A GUI for nnU-Net workflows and nnInteractive-powered annotation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Lars Krämer"}, {email = "lars.kraemer@dkfz-heidelberg.de"},]
dependencies = ["PyYAML>=6.0", "PySide6>=6.6", "mitk-python>=2026.06", "napari>=0.5", "napari-nninteractive[local]>=2.5.3", "nnunetv2>=2.8.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
nnworkbench = "nnworkbench.cli:main"
nnworkbench-gui = "nnworkbench.app:main"

[tool.setuptools.package-data]
nnworkbench = ["assets/*.svg", "assets/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
