[build-system]
requires = ["setuptools>=77"]  # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "nnworkbench"
version = "0.1.0"
description = "A GUI for nnU-Net workflows and nnInteractive-powered annotation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Lars Krämer", email = "lars.kraemer@dkfz-heidelberg.de"}]
keywords = ["nnU-Net", "nnInteractive", "segmentation", "annotation", "medical imaging", "deep learning", "GUI", "napari"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["nnunetv2>=2.8.1,<3"]

[project.urls]
# TODO: replace the placeholders once the repository is public
Homepage = "https://REPOSITORY-URL"
Repository = "https://REPOSITORY-URL"
Documentation = "https://REPOSITORY-URL/blob/main/src/nnworkbench/assets/annotation_workflow/README.md"
Issues = "https://REPOSITORY-URL/issues"

[project.optional-dependencies]
# Two installations: `nnworkbench` (core: nnU-Net, bundled trainers, CLI; e.g. for a cluster) and
# `nnworkbench[all]` (core + the app with Napari, MITK and local nnInteractive).
# `gui` is the app without a Qt binding, used by `all` and for Qt 5 (`pip install "nnworkbench[gui]" PyQt5`).
gui = [
    "qtpy>=2.4,<3",
    "mitk-python>=2026.06,<2027",
    "napari>=0.5,<1",
    "napari-layer-statistics>=1,<2",
    "napari-nninteractive[local]>=2.5.3,<3",
]
all = ["nnworkbench[gui]", "PySide6>=6.6,<7"]
dev = ["qtpy>=2.4,<3", "PySide6>=6.6,<7", "pytest>=8.0,<9", "ruff>=0.6,<1", "build>=1,<2"]

[project.scripts]
nnworkbench-gui = "nnworkbench.app:main"
nnworkbench-set-paths = "nnworkbench.path_setup:set_paths_main"
nnworkbench-get-paths = "nnworkbench.path_setup:get_paths_main"
nnworkbench-run = "nnworkbench.command_runner:main"

[tool.setuptools.package-data]
nnworkbench = [
    "assets/icons/*.svg",
    "assets/images/dkfz-logo.svg",
    "assets/images/helmholtz-imaging-logo.svg",
    "assets/annotation_workflow/*.md",
    "assets/annotation_workflow/images/*.png",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# nnU-Net discovers trainers by this module name, and its trainers take torch.device("cuda") as default.
"src/nnworkbench/nnunet_trainers/*.py" = ["N999", "B008"]
