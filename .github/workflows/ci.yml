name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        qt: [pyside6, pyqt5]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        # Qt's GUI library links EGL, OpenGL, xkbcommon, fontconfig, D-Bus and glib, which the Ubuntu runner image
        # does not ship completely (libEGL.so.1 was missing in Nov 2026)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: python -m pip install '.[dev]'
      - if: matrix.qt == 'pyqt5'
        run: python -m pip install 'PyQt5>=5.15,<6'
      - run: ruff check .
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
        shell: bash  # the glob also expands on Windows
      - run: nnworkbench-set-paths --help
      - run: nnworkbench-run --help
      - run: pytest -q
