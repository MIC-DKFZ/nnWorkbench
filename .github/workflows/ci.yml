name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        qt: [pyside6, pyqt5]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[dev]'
      - if: matrix.qt == 'pyqt5'
        run: python -m pip install 'PyQt5>=5.15,<6'
      - run: ruff check .
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall --no-deps dist/nnworkbench-0.1.0-py3-none-any.whl
      - run: nnworkbench-set-paths --help
      - run: nnworkbench-run --help
      - run: pytest -q
